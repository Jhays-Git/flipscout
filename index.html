<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipScout</title>
<meta name="description" content="Price research for resellers. Use any AI tool to find comparable sales, then see what to list it for and the most you should pay.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 3h20v26H9L2 16z' fill='%23ffd23f' stroke='%2314213d' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='9' cy='16' r='2.6' fill='%2314213d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --ink-2:#3b475f; --muted:#566277; --paper:#f3f5f8; --card:#fff; --line:#d8dee8; --line-2:#eef1f6;
  --sticker:#ffd23f; --sticker-2:#ffe9a0; --sticker-ink:#33270a;
  --great:#126b3a; --good:#1e7a46; --good-bg:#e4f4ea; --okay:#855400; --okay-bg:#fff0cf; --skip:#a52a24; --skip-bg:#fbe3e1;
  --link:#1a4fd1; --focus:#1a4fd1; --hole:#fff; --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
h1,h2,h3{line-height:1.2;letter-spacing:-.015em;margin:0}
p{margin:0 0 .75em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:50}
.skip:focus{left:8px}

.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;padding:12px 0}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:19px 12px 16px;color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current=page]{color:var(--ink);font-weight:800;border-bottom-color:var(--sticker)}
@media (max-width:700px){
  .top-in{gap:0;padding:0 12px}
  nav{width:100%;overflow-x:auto;flex-wrap:nowrap}
  nav a{padding:10px 10px 8px;white-space:nowrap}
}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
.stack{display:grid;gap:20px}
.lead h1{font-size:clamp(28px,4.2vw,40px);font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.lead p{max-width:62ch;color:var(--ink-2);font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card h2{font-size:20px;font-weight:750}
.sub{color:var(--muted);margin:4px 0 16px;font-size:15px}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;margin-top:1px}
.step .sub{margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 16px}
label{display:block;font-weight:650;font-size:14px;margin-bottom:4px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid #9aa6b9;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ink)}
input[aria-invalid=true]{border-color:var(--skip);background:#fff8f7}
textarea{resize:vertical;min-height:140px}
.promptbox{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:260px;background:#fafbfd}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.gap-t{margin-top:16px}
.btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{filter:brightness(1.15)}
.btn.secondary{background:#fff;color:var(--ink)}
.btn.secondary:hover{background:var(--line-2);filter:none}
.btn.accent{background:var(--sticker);border-color:var(--sticker-ink);color:var(--sticker-ink)}
.btn.accent:hover{filter:brightness(.96)}
.btn.small{padding:6px 11px;font-size:14px}
.btn.danger{background:#fff;color:var(--skip);border-color:var(--skip)}
.btn.armed{background:var(--skip);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:3px solid var(--focus);outline-offset:2px}

.notice{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--line-2);font-size:15px}
.notice.warn{background:var(--okay-bg);border-color:#e3c27a;color:#4d3200}
.notice.bad{background:var(--skip-bg);border-color:#eaa7a2;color:#6d1410}
.notice.ok{background:var(--good-bg);border-color:#9ccfb0;color:#0e4a28}
.notice strong{display:block}
.notice ul{margin:6px 0 0;padding-left:20px}
.notice details{margin-top:6px}
.small{font-size:14px;color:var(--muted)}

/* the price tags */
.tags{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:14px;align-items:end;margin:6px 0 4px}
.tag{position:relative;background:var(--sticker-2);color:var(--sticker-ink);padding:14px 18px 14px 44px;clip-path:polygon(26px 0,100% 0,100% 100%,26px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:15px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--hole);box-shadow:inset 0 0 0 1.5px rgba(51,39,10,.45)}
.tag.main{background:var(--sticker);padding:20px 22px 20px 50px;clip-path:polygon(30px 0,100% 0,100% 100%,30px 100%,0 50%)}
.tag.main::before{left:18px;width:12px;height:12px;margin-top:-6px}
.tag .k{font-weight:700;font-size:15px}
.tag .v{font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tag.main .v{font-size:clamp(38px,6vw,54px)}
.tag .s{font-size:14px;margin-top:4px;color:#4d3b0a}
@media (max-width:760px){
  .tags{grid-template-columns:1fr}
  .tag.main{order:-1}
}

.pill{display:inline-block;padding:2px 11px;border-radius:999px;font-weight:750;font-size:13px;border:1px solid transparent;white-space:nowrap}
.pill.l3{background:var(--great);color:#fff}
.pill.l2{background:var(--good-bg);color:var(--good);border-color:#8cc7a4}
.pill.l1{background:var(--okay-bg);color:var(--okay);border-color:#e3c27a}
.pill.l0{background:var(--skip-bg);color:var(--skip);border-color:#eaa7a2}
.pill.lna{background:var(--line-2);color:var(--muted);border-color:var(--line)}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2);font-size:13px;border:1px solid var(--line);margin:0 4px 4px 0}
.chip.warn{background:var(--okay-bg);border-color:#e3c27a;color:var(--okay)}
.chip.bad{background:var(--skip-bg);border-color:#eaa7a2;color:var(--skip)}

.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.meter{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--ink)}
.verdict{font-size:17px}
.verdict b{font-weight:750}
.subhead{font-size:16px;font-weight:750;margin:0 0 8px}
.whatif{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:4px 0 16px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:700;background:var(--line-2);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right}
th.num{text-align:right}
tr.off td{color:#7b8698}
tr.hl td{background:#fffbe8}
.strip{width:100%;height:auto;display:block}
.strip text{font:12px "Bricolage Grotesque",system-ui,sans-serif;fill:var(--ink-2)}
.strip .axis{stroke:var(--line);stroke-width:1}
.strip .band{fill:var(--sticker-2);opacity:.75}
.strip .mkt{stroke:var(--sticker-ink);stroke-width:2}
.strip .sold{fill:var(--ink)}
.strip .act{fill:#fff;stroke:var(--ink);stroke-width:2}
.strip .off{opacity:.25}
.strip .cost{fill:var(--skip)}

.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.deal{display:flex;flex-direction:column;gap:10px}
.deal h3{font-size:17px;font-weight:750}
.deal .top-r{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--line-2);border-radius:8px;padding:10px}
.nums div b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nums div span{font-size:13px;color:var(--muted)}
.deal .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.status-saved{border-color:#8cc7a4}
.status-bought{border-color:var(--ink);border-width:2px}
.status-dismissed{opacity:.65}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.empty{text-align:center;padding:36px 20px;color:var(--ink-2)}
.empty b{display:block;font-size:18px;margin-bottom:4px;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:90vw;box-shadow:0 6px 24px rgba(20,33,61,.25)}
.toast.bad{background:var(--skip)}
footer{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:14px}
footer p{max-width:80ch}
.prose{max-width:72ch}
.prose h2{margin:22px 0 6px}
.prose h2:first-child{margin-top:0}
.prose ul,.prose ol{padding-left:22px;margin:0 0 .8em}
.prose li{margin-bottom:4px}
.tblnum{width:90px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="top-in">
  <a class="brand" href="#/research" aria-label="FlipScout home">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h20v26H9L2 16z" fill="#ffd23f" stroke="#14213d" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="16" r="2.6" fill="#14213d"/></svg>
    FlipScout
  </a>
  <nav aria-label="Main">
    <a href="#/research" data-r="research">Price check</a>
    <a href="#/deals" data-r="deals">Deal feed</a>
    <a href="#/history" data-r="history">History</a>
    <a href="#/settings" data-r="settings">Settings</a>
    <a href="#/guide" data-r="guide">Guide</a>
  </nav>
</div></header>
<div id="banner"></div>
<main id="main" class="wrap" tabindex="-1"><noscript>FlipScout needs JavaScript turned on.</noscript></main>
<footer>
  <p>FlipScout is a class project. Prices, fees and profit figures are estimates from AI research, not financial advice. Check every link and the current fees before you buy or sell. Everything you enter stays in this browser.</p>
</footer>
<div id="toast-host" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============ constants ============ */
const NS = 'flipscout_v1_';
const SCHEMA = 'flipscout-1';
const DAY = 86400000;

const GENERAL_RISKS = ['counterfeit_risk','condition_uncertain','price_volatile','low_liquidity','variant_ambiguity','locked_device_risk','resealed_risk','local_pickup_only','stale_data','restoration_risk','untested_or_as_is','modified_or_repaired','sizing_uncertain','heavy_item'];
const DEAL_RISKS = GENERAL_RISKS.concat(['price_too_good','possible_fake','stock_photo_only','missing_details','unverified_seller','far_pickup']);
const SEVERE = new Set(['price_too_good','possible_fake','counterfeit_risk','resealed_risk','locked_device_risk']);

const CATS = {
  pokemon_single: {
    label: 'Pokémon card (single)', ship: 1.5, platform: 'ebay',
    sources: ['eBay sold listings (use the "Sold items" filter)', 'TCGplayer (market price and recent sales)', 'PriceCharting'],
    rules: ['Match the set, card number, language, printing (holo, reverse holo, 1st edition and so on) and grade. Never mix graded and raw cards.',
            'For raw cards, compare the same condition (Near Mint with Near Mint, and so on).',
            'Only use listings whose title or photos show the same set and card number. Ignore reprints and look-alikes.'],
    req: ['name', 'set'],
    fields: [
      { k: 'name', l: 'Card name', ph: 'e.g. Charizard ex' },
      { k: 'set', l: 'Set', ph: 'e.g. Obsidian Flames' },
      { k: 'number', l: 'Card number', ph: 'e.g. 125/197' },
      { k: 'language', l: 'Language', t: 'select', o: ['English', 'Japanese', 'Other'] },
      { k: 'printing', l: 'Printing or variant', ph: 'e.g. Holo, Reverse holo, 1st Edition' },
      { k: 'grade', l: 'Grade', t: 'select', o: ['Raw (ungraded)', 'PSA 10', 'PSA 9', 'PSA 8 or lower', 'BGS or CGC graded', 'Other graded'] },
      { k: 'condition', l: 'Condition (raw cards)', t: 'select', o: ['Near Mint', 'Lightly Played', 'Moderately Played', 'Heavily Played', 'Damaged'] }
    ],
    title: d => (d.name || '') + (d.set ? ' (' + d.set + (d.number ? ' ' + d.number : '') + ')' : '') + (d.grade && d.grade !== 'Raw (ungraded)' ? ', ' + d.grade : '')
  },
  pokemon_sealed: {
    label: 'Pokémon sealed product', ship: 7, platform: 'ebay',
    sources: ['eBay sold listings (use the "Sold items" filter)', 'TCGplayer (sealed product market price and recent sales)', 'PriceCharting', 'Facebook Marketplace or Mercari asking prices (label these "active")'],
    rules: ['Match the product type, set, language and edition exactly.',
            'Count only factory-sealed items in the stated box condition.',
            'Watch for resealed or fake product. Note anything suspicious in "notes".'],
    req: ['product', 'set'],
    fields: [
      { k: 'product', l: 'Product', ph: 'e.g. Elite Trainer Box' },
      { k: 'set', l: 'Set', ph: 'e.g. Prismatic Evolutions' },
      { k: 'language', l: 'Language', t: 'select', o: ['English', 'Japanese', 'Other'] },
      { k: 'edition', l: 'Edition', t: 'select', o: ['Standard', '1st Edition', 'Unlimited', 'Other'] },
      { k: 'condition', l: 'Box condition', t: 'select', o: ['Factory sealed, mint box', 'Factory sealed, minor box wear', 'Factory sealed, dented or torn box'] }
    ],
    title: d => (d.product || '') + (d.set ? ' (' + d.set + ')' : '')
  },
  laptop: {
    label: 'MacBook, laptop or tech', ship: 18, platform: 'ebay',
    sources: ['eBay sold listings (use the "Sold items" filter)', 'Swappa', 'Back Market', 'Facebook Marketplace or Craigslist asking prices (label these "active")', 'The maker\'s refurbished store price, for reference (label it "active")'],
    rules: ['Match model, year, chip or processor, RAM and storage. Do not mix configurations.',
            'Compare the same condition grade.',
            'Flag activation-lock, iCloud-lock, battery-health or screen-damage concerns in "notes" and "risk_flags".'],
    req: ['model'],
    fields: [
      { k: 'model', l: 'Model', ph: 'e.g. MacBook Air 13-inch' },
      { k: 'year', l: 'Year', ph: 'e.g. 2022' },
      { k: 'chip', l: 'Chip or processor', ph: 'e.g. Apple M2' },
      { k: 'ram', l: 'Memory (RAM)', ph: 'e.g. 8 GB' },
      { k: 'storage', l: 'Storage', ph: 'e.g. 256 GB' },
      { k: 'battery', l: 'Battery cycles (optional)', ph: 'e.g. 120' },
      { k: 'condition', l: 'Condition', t: 'select', o: ['Like new', 'Very good', 'Good', 'Fair', 'For parts or repair'] },
      { k: 'accessories', l: 'Included', t: 'select', o: ['Charger included', 'Charger and original box', 'No charger'] },
      { k: 'lock', l: 'Lock status', t: 'select', o: ['No activation lock', 'Unknown'] }
    ],
    title: d => (d.model || '') + ([d.year, d.chip, d.ram, d.storage].filter(Boolean).length ? ' (' + [d.year, d.chip, d.ram, d.storage].filter(Boolean).join(', ') + ')' : '')
  },
  furniture: {
    label: 'Couch or furniture (experimental)', ship: 0, platform: 'local', experimental: true,
    sources: ['Facebook Marketplace', 'Craigslist', 'OfferUp', 'Chairish or AptDeco', 'eBay (local pickup or freight listings)'],
    rules: ['Furniture mostly sells locally and sold prices are rarely public. Most comps will be "active" asking prices, which is fine, but label them correctly.',
            'Match type, brand or line, size, material and condition.',
            'Say in "limitations" that sold data was not available, if that is the case.'],
    req: ['type'],
    fields: [
      { k: 'type', l: 'Type', ph: 'e.g. 3-seat sofa' },
      { k: 'brand', l: 'Brand or line', ph: 'e.g. West Elm Harmony' },
      { k: 'material', l: 'Material and color', ph: 'e.g. Gray velvet, oak legs' },
      { k: 'dimensions', l: 'Dimensions', ph: 'e.g. 84 x 36 x 33 in' },
      { k: 'condition', l: 'Condition', t: 'select', o: ['Like new', 'Very good', 'Good', 'Fair', 'Worn'] },
      { k: 'area', l: 'Metro area (optional)', ph: 'City level only' }
    ],
    title: d => (d.type || '') + (d.brand ? ', ' + d.brand : '')
  },
  comic: {
    label: 'Comic book', ship: 5, platform: 'ebay',
    sources: ['eBay sold listings (use the "Sold items" filter)', 'GoCollect or CovrPrice (recent sales by grade)', 'Heritage Auctions or ComicConnect completed sales (for graded or high-value books)'],
    rules: ['Match the series, issue number, volume or year, publisher, printing and cover variant (newsstand, direct edition, 1:25 variant and so on).',
            'Match the grade. Never mix CGC or CBCS graded books with raw ones, and compare raw books in the same condition.',
            'Flag restored, pressed or trimmed books in "notes" and "risk_flags". Say if the issue is a key issue (first appearance, death, origin).'],
    req: ['series', 'issue'],
    fields: [
      { k: 'series', l: 'Series title', ph: 'e.g. Amazing Spider-Man' },
      { k: 'issue', l: 'Issue number', ph: 'e.g. 300' },
      { k: 'volume', l: 'Volume or year', ph: 'e.g. Vol. 1 (1963)' },
      { k: 'variant', l: 'Printing or variant', ph: 'e.g. 1st print, newsstand, 1:25 variant' },
      { k: 'grade', l: 'Grade', t: 'select', o: ['Raw (ungraded)', 'CGC 9.8', 'CGC 9.6', 'CGC 9.4 or lower', 'CBCS graded', 'Other graded'] },
      { k: 'condition', l: 'Condition (raw books)', t: 'select', o: ['Near Mint', 'Very Fine', 'Fine', 'Very Good', 'Good or lower'] }
    ],
    title: d => (d.series || '') + (d.issue ? ' #' + d.issue : '') + (d.volume ? ' (' + d.volume + ')' : '') + (d.grade && d.grade !== 'Raw (ungraded)' ? ', ' + d.grade : '')
  },
  shoes: {
    label: 'Shoes and sneakers', ship: 12, platform: 'ebay',
    sources: ['eBay sold listings (use the "Sold items" filter)', 'StockX and GOAT (last sale and recent sales)', 'Poshmark or Grailed asking prices (label these "active")'],
    rules: ['Match brand, model, colorway, style code and size. Size changes price a lot, so say which size each comp is.',
            'Compare the same condition: new in box, new without box, or used.',
            'Authenticity matters. Flag any listing with missing tags, odd photos or a price far under market.'],
    req: ['brand', 'model'],
    fields: [
      { k: 'brand', l: 'Brand', ph: 'e.g. Nike' },
      { k: 'model', l: 'Model', ph: 'e.g. Air Jordan 1 Retro High OG' },
      { k: 'colorway', l: 'Colorway', ph: 'e.g. Chicago' },
      { k: 'sku', l: 'Style code (optional)', ph: 'e.g. DZ5485-612' },
      { k: 'size', l: 'Size', ph: 'e.g. 10.5 men\'s' },
      { k: 'condition', l: 'Condition', t: 'select', o: ['New in box (deadstock)', 'New without box', 'Excellent used', 'Good used', 'Worn'] },
      { k: 'box', l: 'Box', t: 'select', o: ['Original box included', 'No original box'] }
    ],
    title: d => [d.brand, d.model, d.colorway].filter(Boolean).join(' ') + (d.size ? ', size ' + d.size : '')
  },
  clothing: {
    label: 'Vintage clothing and brands', ship: 8, platform: 'ebay',
    sources: ['eBay sold listings (use the "Sold items" filter)', 'Depop, Poshmark and Etsy vintage asking prices (label these "active")', 'Grailed (for Carhartt, Levi\'s and workwear)'],
    rules: ['Match the brand, garment type, size and era. Tag style and details change value a lot (for example single stitch, big E tag, Made in USA, Detroit or Chore cut).',
            'Compare the same condition. Flaws such as stains, holes or fading lower the price.',
            'Fakes are common for Coach and some denim. Check serial or creed patches, hardware and stitching, and flag doubts in "risk_flags".'],
    req: ['garment'],
    fields: [
      { k: 'brand', l: 'Brand', t: 'select', o: ['American Eagle', 'Hollister', 'Levi\'s', 'Carhartt', 'GAP', 'Banana Republic', 'Coach', 'Other'] },

function analyze(rep) {
  const tot = c => c.price + (c.shipping || 0);
  const used = rep.comps.filter(c => c.include);
  const sold = used.filter(c => c.type === 'sold').map(tot).sort(asc);
  const act = used.filter(c => c.type === 'active').map(tot).sort(asc);
  const hair = S.activeHaircut / 100;
  let basis = 'none', market = null, quick = null, patient = null;
  if (sold.length >= 3) { basis = 'sold'; market = median(sold); quick = quantile(sold, 0.25); patient = quantile(sold, 0.75); }
  else if (sold.length > 0 && act.length > 0) { basis = 'mixed'; const sm = median(sold), am = median(act) * (1 - hair); market = (sm + am) / 2; quick = Math.min(sm, am); patient = Math.max(sm, median(act) * (1 - hair / 2)); }
  else if (sold.length > 0) { basis = 'thin'; market = median(sold); quick = sold.length > 1 ? sold[0] : market * 0.92; patient = sold.length > 1 ? sold[sold.length - 1] : market * 1.05; }
  else if (act.length > 0) { basis = 'active'; const am = median(act) * (1 - hair); market = am; quick = Math.min(quantile(act, 0.25) * (1 - hair), am * 0.97); patient = median(act); }
  if (market !== null) { market = round2(market); quick = round2(Math.min(quick, market)); patient = round2(Math.max(patient, market)); }
  const cat = rep.category, pk = rep.platform || S.defaultPlatform[cat] || 'ebay', cost = rep.cost > 0 ? rep.cost : 0;
  const an = { basis, market, quick, patient, soldCount: sold.length, activeCount: act.length, usedCount: used.length, excluded: rep.comps.length - used.length, pk, cost };
  if (market !== null) {
    an.at = { quick: calcAt(quick, cat, pk, cost), market: calcAt(market, cat, pk, cost), patient: calcAt(patient, cat, pk, cost) };
    an.maxBuy = { great: maxBuy(an.at.market.takeHome, 3), good: maxBuy(an.at.market.takeHome, 2), okay: maxBuy(an.at.market.takeHome, 1) };
    an.platforms = Object.keys(S.platforms).map(k => ({ key: k, label: S.platforms[k].label, calc: calcAt(market, cat, k, cost) }));
  }
  const reasons = []; let score = 0;
  const sc = an.soldCount, ac = an.activeCount;
  const sPts = sc >= 6 ? 40 : sc >= 4 ? 34 : sc === 3 ? 28 : sc === 2 ? 18 : sc === 1 ? 10 : 0;
  score += sPts; reasons.push(sc + ' sold comp' + (sc === 1 ? '' : 's') + ' used (+' + sPts + ')');
  const aPts = ac >= 3 ? 8 : ac >= 1 ? 4 : 0;
  if (aPts) { score += aPts; reasons.push(ac + ' asking-price comp' + (ac === 1 ? '' : 's') + ' used (+' + aPts + ')'); }
  const srcs = new Set(used.map(c => c.source.toLowerCase())).size;
  const srcPts = srcs >= 3 ? 10 : srcs === 2 ? 6 : 0;
  if (srcPts) { score += srcPts; reasons.push(srcs + ' different sources (+' + srcPts + ')'); } else reasons.push('Only one source (+0)');
  if (used.length) {
    const w = { exact: 1, close: 0.6, unknown: 0.25, different: 0 };
    const m = used.reduce((a, c) => a + w[c.variant_match], 0) / used.length, mp = Math.round(15 * m);
    score += mp; reasons.push('Variant match ' + Math.round(m * 100) + '% (+' + mp + ')');
  }
  const soldDated = used.filter(c => c.type === 'sold' && c.date);
  if (soldDated.length) {
    const recent = soldDated.filter(c => Date.now() - isoToTs(c.date) <= 60 * DAY).length / soldDated.length, rp = Math.round(10 * recent);
    score += rp; reasons.push(Math.round(recent * 100) + '% of dated sales are from the last 60 days (+' + rp + ')');
    an.staleShare = soldDated.filter(c => Date.now() - isoToTs(c.date) > 90 * DAY).length / soldDated.length;
  }
  const ver = used.filter(c => c.verified).length;
  if (ver >= 2) { score += 10; reasons.push(ver + ' comps you verified by opening the link (+10)'); } else if (ver === 1) { score += 5; reasons.push('1 comp you verified (+5)'); } else reasons.push('No comps verified yet. Open a few links and tick "Checked" (+0)');
  if (sold.length >= 3) {
    const spread = (quantile(sold, 0.75) - quantile(sold, 0.25)) / median(sold); an.spread = spread;
    if (spread > 0.4) { score -= 10; reasons.push('Sold prices vary a lot (−10)'); } else if (spread > 0.25) { score -= 5; reasons.push('Sold prices vary somewhat (−5)'); }
  }
  if (sc === 0) { if (score > 39) reasons.push('Capped at Low: no sold comps'); score = Math.min(score, 39); }

    else if (sc < 3) flags.push(['warn', 'Thin sold data: fewer than 3 sold comps']);
    if (an.spread > 0.4) flags.push(['warn', 'Wide price spread']);
    if (an.staleShare > 0.5) flags.push(['warn', 'Most sales are older than 90 days']);
    if (used.length && used.filter(c => c.variant_match === 'unknown').length / used.length > 0.5) flags.push(['warn', 'Variant match is unknown for most comps']);
    if (an.excluded > 0) flags.push(['', an.excluded + ' comp' + (an.excluded === 1 ? '' : 's') + ' left out']);
  }
  an.flags = flags;
  return an;
}

function dealMetrics(d) {
  const cat = d.category, pk = S.defaultPlatform[cat] || 'ebay';

  const soldEv = (d.evidence || []).filter(e => e.type === 'sold').map(e => e.price + (e.shipping || 0)).sort(asc);

  if (soldEv.length >= 2) { evMedian = median(soldEv); if (est > evMedian * 1.2) { est = round2(evMedian); adjusted = true; } }
  else if (soldEv.length === 0) { est = round2(est * (1 - S.activeHaircut / 100)); discounted = true; }
  const c = calcAt(est, cat, pk, cost);

  const sp = ns >= 3 ? 45 : ns === 2 ? 32 : ns === 1 ? 16 : 0; score += sp; reasons.push(ns + ' sold price' + (ns === 1 ? '' : 's') + ' as evidence (+' + sp + ')');

}
